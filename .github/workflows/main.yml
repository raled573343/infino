name: Build Python Wheels for Windows

on:
  release:
    types: [published]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheel on Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install maturin
        run: pip install maturin

      - name: Locate Python binding directory
        id: locate
        shell: pwsh
        run: |
          $paths = @("infino-python", "bindings/python", "python", "infino-py", "py")
          $found = $null
          foreach ($p in $paths) {
            if (Test-Path $p) {
              $found = $p
              break
            }
          }
          if ($found) {
            echo "BINDING_DIR=$found" >> $env:GITHUB_OUTPUT
            Write-Host "Found binding directory: $found"
          } else {
            Write-Error "Could not find Python binding directory. Checked paths: $($paths -join ', ')"
            exit 1
          }

      - name: Build wheel
        shell: pwsh
        run: |
          cd ${{ steps.locate.outputs.BINDING_DIR }}
          maturin build --release --out dist --target x86_64-pc-windows-msvc --bindings pyo3
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: infino-wheel-py${{ matrix.python-version }}
          path: ${{ steps.locate.outputs.BINDING_DIR }}/dist/*.whl
